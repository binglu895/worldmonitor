name: Build and Push to GHCR

# 当你把代码 push 到 main 分支时，自动触发这个任务
on:
  push:
    branches: [ "main" ] # 如果你的主分支叫 master，请改为 master

env:
  # GitHub 镜像仓库地址
  REGISTRY: ghcr.io
  # 镜像完整名称（【注意】GitHub 要求镜像名必须全部小写，请把下面的 koala73 改为你的 GitHub 用户名）
  IMAGE_TAG: ghcr.io/koala73/worldmonitor:latest

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    
    # 授予该任务向 GitHub Packages 写入镜像的权限
    permissions:
      contents: read
      packages: write

    steps:
      # 1. 拉取你的代码
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. 登录到 GitHub Container Registry
      - name: Log in to the Container registry
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          # secrets.GITHUB_TOKEN 是 GitHub 自动生成的临时密码，无需手动配置
          password: ${{ secrets.GITHUB_TOKEN }}

      # 3. 在云端利用你的 Dockerfile 构建并推送镜像
      - name: Build and push Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          push: true
          tags: ${{ env.IMAGE_TAG }}
